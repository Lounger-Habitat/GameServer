[project]
name = "api-server"
version = "0.1.0"
description = "Modular FastAPI Server with RESTful API and WebSocket support"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.124.0",
    "menglong>=0.1.0",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
    "pyyaml>=6.0.3",
    "websockets>=15.0.1",
]

[tool.uv.sources]
menglong = { git = "https://github.com/gcyyfun/menglong.git" }
