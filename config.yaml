# API Server 配置文件

# 服务器配置
server:
  host: "0.0.0.0"
  port: 8000
  reload: true  # 开发模式下自动重载

# 模块启用开关
modules:
  # RESTful API 模块
  enable_openai_api: false      # OpenAI 兼容 API
  enable_response_api: false    # OpenAI Response API
  enable_menglong_api: true    # 朦胧 API
  
  # WebSocket 模块
  enable_websocket: true       # WebSocket (StarProtocol)

# CORS 配置
cors:
  enabled: true
  allow_origins: ["*"]
  allow_credentials: true
  allow_methods: ["*"]
  allow_headers: ["*"]

# 日志配置
logging:
  level: "INFO"  # DEBUG, INFO, WARNING, ERROR, CRITICAL

# 鉴权配置
auth:
  enabled: true                  # 是否启用 API Key 鉴权
  keys_file: "api_keys.json"     # API Keys 存储文件
  allow_no_auth_paths:           # 无需鉴权的路径前缀
    - "/health"
    - "/docs"
    - "/redoc"
    - "/openapi.json"
    - "/auth"
    - "/statistics/dashboard"   # Dashboard 页面公开访问

# 统计模块配置
statistics:
  enabled: true                  # 是否启用统计
  database_file: "statistics.db" # SQLite 数据库文件
  retention_days: 0              # 数据保留天数（0=永久保留）
  async_logging: true            # 是否异步记录（推荐）

